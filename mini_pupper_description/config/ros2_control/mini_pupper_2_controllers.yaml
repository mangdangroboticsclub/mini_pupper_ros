controller_manager:
  ros__parameters:
    use_sim_time: False
    update_rate: 100  # Hz (realistic for servo hardware, still >67Hz for smooth interpolation)
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    simple_quadruped_controller:
      type: mini_pupper_controllers/SimpleQuadrupedController

joint_state_broadcaster:
  ros__parameters:
    joints:
      - base_lf1
      - lf1_lf2
      - lf2_lf3
      - base_rf1
      - rf1_rf2
      - rf2_rf3
      - base_lb1
      - lb1_lb2
      - lb2_lb3
      - base_rb1
      - rb1_rb2
      - rb2_rb3

simple_quadruped_controller:
  ros__parameters:
    use_sim_time: False
    joints:
      - base_rf1
      - rf1_rf2
      - rf2_rf3
      - base_lf1
      - lf1_lf2
      - lf2_lf3
      - base_rb1
      - rb1_rb2
      - rb2_rb3
      - base_lb1
      - lb1_lb2
      - lb2_lb3
    default_positions:
      # RF leg (right front): positive abduction (legs outward)
      - 0.080   # base_rf1 (abduction)
      - 1.078   # rf1_rf2 (hip)
      - -1.983  # rf2_rf3 (knee)
      # LF leg (left front): negative abduction (legs outward)
      - -0.080  # base_lf1 (abduction)
      - 1.078   # lf1_lf2 (hip)
      - -1.983  # lf2_lf3 (knee)
      # RB leg (right back): positive abduction (legs outward)
      - 0.080   # base_rb1 (abduction)
      - 1.078   # rb1_rb2 (hip)
      - -1.983  # rb2_rb3 (knee)
      # LB leg (left back): negative abduction (legs outward)
      - -0.080  # base_lb1 (abduction)
      - 1.078   # lb1_lb2 (hip)
      - -1.983  # lb2_lb3 (knee)
