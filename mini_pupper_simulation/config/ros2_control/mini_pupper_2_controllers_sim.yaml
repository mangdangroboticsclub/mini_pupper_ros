controller_manager:
  ros__parameters:
    use_sim_time: True
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    simple_quadruped_controller:
      type: mini_pupper_controllers/SimpleQuadrupedController

simple_quadruped_controller:
  ros__parameters:
    use_sim_time: True
    joints:
      - base_lf1
      - lf1_lf2
      - lf2_lf3
      - base_rf1
      - rf1_rf2
      - rf2_rf3
      - base_lb1
      - lb1_lb2
      - lb2_lb3
      - base_rb1
      - rb1_rb2
      - rb2_rb3
    default_positions:
      - 0.0
      - 0.994
      - -1.767
      - 0.0
      - 0.994
      - -1.767
      - 0.0
      - 0.994
      - -1.767
      - 0.0
      - 0.994
      - -1.767
    # Spawn still settles into the measured passive crouch from the URDF startup pose.
    # With no external command, the controller now holds that crouch briefly and then
    # ramps slowly toward this nominal stand target.
    idle_ramp_enabled: true
    idle_hold_duration_sec: 3.0
    idle_ramp_duration_sec: 5.0
    parallel_linkage_compensation: true