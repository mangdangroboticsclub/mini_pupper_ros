version: '3.8'

services:
  mini_pupper_ros:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: mini_pupper_ros:jazzy
    container_name: mini_pupper_ros_jazzy
    environment:
      - ROS_DISTRO=jazzy
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - .:/ros2_ws/src/mini_pupper_ros
    network_mode: host
    privileged: true
    stdin_open: true
    tty: true
    command: /bin/bash

  mini_pupper_rviz:
    image: mini_pupper_ros:jazzy
    container_name: mini_pupper_rviz
    environment:
      - ROS_DISTRO=jazzy
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    network_mode: host
    command: >
      bash -c "source /opt/ros/jazzy/setup.bash &&
               source /ros2_ws/install/setup.bash &&
               ros2 launch mini_pupper_bringup bringup.launch.py"
