amcl:
  ros__parameters:
    use_sim_time: False
    base_frame_id: "base_footprint"
    global_frame_id: "map"
    odom_frame_id: "odom"
    scan_topic: scan
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    laser_model_type: "likelihood_field"
    set_initial_pose: True
    initial_pose: 
      x: 0.0
      y: 0.0
      yaw: 0.0
    
    # Motion model noise - adjusted for trotting gait with 4cm vertical oscillation
    # Higher values account for leg placement uncertainty and body sway
    alpha1: 0.08  # Rotation noise from translation (gait-induced yaw drift)
    alpha2: 0.08  # Translation noise from translation (leg slip)
    alpha3: 0.15  # Translation noise from rotation (centrifugal effects)
    alpha4: 0.15  # Rotation noise from rotation (turning slip)
    alpha5: 0.05  # Translation noise from lateral motion (minimal for quadruped)
    
    # Transform tolerance - START CONSERVATIVE for WiFi, then tighten after testing
    # Run 'ros2 run tf2_ros tf2_monitor' to check actual delays
    # If average delay <50ms, reduce to 0.2; if <30ms, try 0.15
    transform_tolerance: 0.3  # START HERE, reduce after measuring actual TF delays
    
    # Beam parameters for lidar processing
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0

    # Particle filter - balanced for 1.5m table with WiFi bandwidth constraints
    # Reduce if 'ros2 topic hz /particlecloud' shows <1Hz publish rate
    max_particles: 400   # Reduce to 300 if network saturated
    min_particles: 150   # Maintain 2.5:1 ratio with max
    max_beams: 40        # Reduce to 30 if CPU on laptop >70%
    
    # Update thresholds - less frequent updates reduce network load
    # Monitor with 'ros2 topic hz /amcl_pose' - should be 1-3 Hz during motion
    update_min_a: 0.15   # ~8.6 degrees rotation before update
    update_min_d: 0.08   # 8cm translation before update
    
    # Laser model - tuned for oscillating lidar from trotting gait
    laser_likelihood_max_dist: 1.2  # Search radius for scan matching
    pf_err: 0.05         # Convergence threshold (5cm)
    pf_z: 0.90           # Overall confidence in sensor model
    lambda_short: 0.1    # Weight for unexpected close readings
    sigma_hit: 0.15      # Expected sensor noise (15cm due to gait oscillation)
    z_hit: 0.65          # Weight on expected measurements
    z_max: 0.05          # Weight on max-range readings
    z_rand: 0.25         # Weight on random noise (high due to gait)
    z_short: 0.05        # Weight on short readings
    resample_interval: 2 # Resample every 2nd update (reduces computation)
    save_pose_rate: 0.5  # Publish pose at 0.5 Hz
    tf_broadcast: true
    laser_max_range: 3.0   # Lidar's actual max range
    laser_min_range: 0.05  # Lidar's actual min range

amcl_map_client:
  ros__parameters:
    use_sim_time: False

amcl_rclcpp_node:
  ros__parameters:
    use_sim_time: False

