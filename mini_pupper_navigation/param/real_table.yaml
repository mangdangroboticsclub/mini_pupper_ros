amcl:
ros__parameters:
  use_sim_time: False
  base_frame_id: "base_footprint"
  global_frame_id: "map"
  odom_frame_id: "odom"
  scan_topic: scan
  robot_model_type: "nav2_amcl::DifferentialMotionModel"
  laser_model_type: "likelihood_field"
  set_initial_pose: True
  initial_pose: 
    x: 0.0
    y: 0.0
    yaw: 0.0
  alpha1: 0.2
  alpha2: 0.2
  alpha3: 0.2
  alpha4: 0.2
  alpha5: 0.2
  beam_skip_distance: 0.5
  beam_skip_error_threshold: 0.9
  beam_skip_threshold: 0.3
  do_beamskip: false
  recovery_alpha_fast: 0.0
  recovery_alpha_slow: 0.0

  max_particles: 1000
  min_particles: 500
  max_beams: 50
  transform_tolerance: 0.5
  update_min_a: 0.2
  update_min_d: 0.25
  laser_likelihood_max_dist: 2.0
  pf_err: 0.05
  pf_z: 0.99
  lambda_short: 0.1
  sigma_hit: 0.2
  z_hit: 0.5
  z_max: 0.05
  z_rand: 0.5
  z_short: 0.05
  resample_interval: 1
  save_pose_rate: 0.5
  tf_broadcast: true
  laser_max_range: 100.0
  laser_min_range: -1.0

amcl_map_client:
ros__parameters:
  use_sim_time: False

amcl_rclcpp_node:
ros__parameters:
  use_sim_time: False

bt_navigator:
ros__parameters:
  use_sim_time: False
  global_frame: map
  robot_base_frame: base_link
  odom_topic: /odom
  bt_loop_duration: 10
  default_server_timeout: 20
  enable_groot_monitoring: True
  groot_zmq_publisher_port: 1666
  groot_zmq_server_port: 1667
  plugin_lib_names:
  - nav2_compute_path_to_pose_action_bt_node
  - nav2_compute_path_through_poses_action_bt_node
  - nav2_follow_path_action_bt_node
  - nav2_back_up_action_bt_node
  - nav2_spin_action_bt_node
  - nav2_wait_action_bt_node
  - nav2_clear_costmap_service_bt_node
  - nav2_is_stuck_condition_bt_node
  - nav2_goal_reached_condition_bt_node
  - nav2_goal_updated_condition_bt_node
  - nav2_initial_pose_received_condition_bt_node
  - nav2_reinitialize_global_localization_service_bt_node
  - nav2_rate_controller_bt_node
  - nav2_distance_controller_bt_node
  - nav2_speed_controller_bt_node
  - nav2_truncate_path_action_bt_node
  - nav2_goal_updater_node_bt_node
  - nav2_recovery_node_bt_node
  - nav2_pipeline_sequence_bt_node
  - nav2_round_robin_node_bt_node
  - nav2_transform_available_condition_bt_node
  - nav2_time_expired_condition_bt_node
  - nav2_distance_traveled_condition_bt_node
  - nav2_single_trigger_bt_node
  - nav2_is_battery_low_condition_bt_node
  - nav2_navigate_through_poses_action_bt_node
  - nav2_navigate_to_pose_action_bt_node
  - nav2_remove_passed_goals_action_bt_node
  - nav2_planner_selector_bt_node
  - nav2_controller_selector_bt_node
  - nav2_goal_checker_selector_bt_node

bt_navigator_rclcpp_node:
ros__parameters:
  use_sim_time: False

controller_server:
ros__parameters:
  use_sim_time: False
  progress_checker_plugin: "progress_checker"
  goal_checker_plugins: ["general_goal_checker"]
  controller_plugins: ["FollowPath"]

  min_x_velocity_threshold: 0.02
  min_y_velocity_threshold: 0.001
  min_theta_velocity_threshold: 0.02
  failure_tolerance: 0.3

  controller_frequency: 20.0

  progress_checker:
    plugin: "nav2_controller::SimpleProgressChecker"
    required_movement_radius: 0.5
    movement_time_allowance: 10.0

  general_goal_checker:
    stateful: True
    plugin: "nav2_controller::SimpleGoalChecker"
    xy_goal_tolerance: 0.125
    yaw_goal_tolerance: 0.25
    
  FollowPath:
    plugin: "dwb_core::DWBLocalPlanner"
    debug_trajectory_details: True
    xy_goal_tolerance: 0.125
    short_circuit_trajectory_evaluation: True
    stateful: True
    transform_tolerance: 0.2

    min_vel_x: 0.0
    min_vel_y: 0.0
    min_speed_xy: 0.0
    min_speed_theta: 0.0
    max_vel_y: 0.0
    max_speed_xy: 0.3

    max_vel_x: 0.3
    max_vel_theta: 0.5
    acc_lim_x: 1.5
    acc_lim_y: 0.0
    acc_lim_theta: 2.0
    decel_lim_x: -2.5
    decel_lim_y: 0.0
    decel_lim_theta: -3.2

    vx_samples: 20
    vy_samples: 5
    vtheta_samples: 20
    sim_time: 1.7
    linear_granularity: 0.05
    angular_granularity: 0.025

    trans_stopped_velocity: 0.07

    critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
    BaseObstacle.scale: 0.02
    PathAlign.scale: 32.0
    PathAlign.forward_point_distance: 0.1
    GoalAlign.scale: 24.0
    GoalAlign.forward_point_distance: 0.1
    PathDist.scale: 32.0
    GoalDist.scale: 24.0
    RotateToGoal.scale: 32.0
    RotateToGoal.slowing_factor: 5.0
    RotateToGoal.lookahead_time: -1.0
    
controller_server_rclcpp_node:
ros__parameters:
  use_sim_time: False

local_costmap:
local_costmap:
  ros__parameters:
    use_sim_time: False
    global_frame: odom
    robot_base_frame: base_link
    rolling_window: true
    plugins: ["obstacle_layer", "inflation_layer"]
    always_send_full_costmap: True

    footprint: "[[-0.105, -0.055], [0.105, -0.055], [0.105, 0.055], [-0.105, 0.055]]"
    width: 2
    height: 2
    resolution: 0.025

    update_frequency: 5.0
    publish_frequency: 2.0

    inflation_layer:
      plugin: "nav2_costmap_2d::InflationLayer"
      inflation_radius: 0.25
      cost_scaling_factor: 5.0

    obstacle_layer:
      plugin: "nav2_costmap_2d::ObstacleLayer"
      enabled: True
      observation_sources: scan
      scan:
        topic: /scan
        max_obstacle_height: 2.0
        clearing: True
        marking: True
        data_type: "LaserScan"

local_costmap_client:
  ros__parameters:
    use_sim_time: False

local_costmap_rclcpp_node:
  ros__parameters:
    use_sim_time: False

global_costmap:
global_costmap:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_link
    track_unknown_space: true
    plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
    always_send_full_costmap: True

    footprint: "[[-0.105, -0.055], [0.105, -0.055], [0.105, 0.055], [-0.105, 0.055]]"
    resolution: 0.025

    update_frequency: 5.0
    publish_frequency: 1.0

    obstacle_layer:
      plugin: "nav2_costmap_2d::ObstacleLayer"
      enabled: True
      observation_sources: scan
      scan:
        topic: /scan
        max_obstacle_height: 2.0
        clearing: True
        marking: True
        data_type: "LaserScan"

    static_layer:
      plugin: "nav2_costmap_2d::StaticLayer"
      map_subscribe_transient_local: True

    inflation_layer:
      plugin: "nav2_costmap_2d::InflationLayer"
      inflation_radius: 0.25
      cost_scaling_factor: 5.0

global_costmap_client:
  ros__parameters:
    use_sim_time: False

global_costmap_rclcpp_node:
  ros__parameters:
    use_sim_time: False

map_server:
ros__parameters:
  use_sim_time: False
  yaml_filename: "map.yaml"

map_saver:
ros__parameters:
  use_sim_time: False

  save_map_timeout: 5.0
  free_thresh_default: 0.25
  occupied_thresh_default: 0.65
  map_subscribe_transient_local: True

planner_server:
ros__parameters:
  use_sim_time: False
  planner_plugins: ["GridBased"]

  expected_planner_frequency: 20.0

  GridBased:
    plugin: "nav2_smac_planner/SmacPlanner2D"
    downsample_costmap: false
    downsampling_factor: 1
    allow_unknown: true
    max_iterations: 1000000
    max_on_approach_iterations: 1000
    motion_model_for_search: "MOORE"
    angle_quantization_bins: 72
    cost_travel_multiplier: 2.0
    use_final_approach_orientation: false

    max_planning_time: 3.0
    tolerance: 0.125

    smoother:
      max_iterations: 1000
      w_smooth: 0.3
      w_data: 0.2
      tolerance: 1.0e-10
      do_refinement: true
      refinement_num: 2

planner_server_rclcpp_node:
ros__parameters:
  use_sim_time: False

behavior_server:
ros__parameters:
  use_sim_time: False
  costmap_topic: local_costmap/costmap_raw
  footprint_topic: local_costmap/published_footprint
  cycle_frequency: 10.0
  behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
  global_frame: odom
  robot_base_frame: base_link
  simulate_ahead_time: 2.0

  transform_tolerance: 0.1
  max_rotational_vel: 0.5
  min_rotational_vel: 0.4
  rotational_acc_lim: 2.0

  spin:
    plugin: "nav2_behaviors/Spin"
  backup:
    plugin: "nav2_behaviors/BackUp"
  drive_on_heading:
    plugin: "nav2_behaviors/DriveOnHeading"
  wait:
    plugin: "nav2_behaviors/Wait"

robot_state_publisher:
ros__parameters:
  use_sim_time: False

waypoint_follower:
ros__parameters:
  use_sim_time: False

  loop_rate: 20
  stop_on_failure: false
  waypoint_task_executor_plugin: "wait_at_waypoint"   

  wait_at_waypoint:
    plugin: "nav2_waypoint_follower::WaitAtWaypoint"
    enabled: True
    waypoint_pause_duration: 200