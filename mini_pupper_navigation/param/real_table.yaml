bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: False

controller_server:
  ros__parameters:
    use_sim_time: False
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.02
    
    failure_tolerance: 0.0
    transform_tolerance: 0.3
    controller_frequency: 20.0

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.025 # too low leads to the harlem shake e.g. 0.001 (1mm)
      movement_time_allowance: 10.0 # lower would lead to premature failure during precise movements

    general_goal_checker:
      stateful: False
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 6.28
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      min_vel_x: 0.05
      min_vel_y: 0.05
      max_vel_x: 0.20
      max_vel_y: 0.20
      max_vel_theta: 0.50
      min_speed_xy: 0.05
      max_speed_xy: 0.20
      min_speed_theta: 0.25
      # 0.2 deltaT for x,y,theta
      acc_lim_x: 0.3
      acc_lim_y: 0.3
      acc_lim_theta: 2.5
      decel_lim_x: -0.3
      decel_lim_y: -0.3
      decel_lim_theta: -2.5
      vx_samples: 7
      vy_samples: 7
      vtheta_samples: 20
      sim_time: 1.0
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.3
      xy_goal_tolerance: 0.10
      trans_stopped_velocity: 0.005
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      PathAlign.scale: 256.0 # just changed from 12 to 64
      PathAlign.forward_point_distance: 0.15
      GoalAlign.scale: 0.0
      GoalAlign.forward_point_distance: 0.15
      PathDist.scale: 64.0
      GoalDist.scale: 0.0
      RotateToGoal.scale: 0.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
      
controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: False

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: False
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      plugins: ["obstacle_layer", "inflation_layer"]
      always_send_full_costmap: True
      transform_tolerance: 0.3

      footprint: "[[-0.105, -0.055], [0.105, -0.055], [0.105, 0.055], [-0.105, 0.055]]"
      
      width: 2
      height: 2
      resolution: 0.02
      
      update_frequency: 3.0
      publish_frequency: 1.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.10
        cost_scaling_factor: 20.0

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 1.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          marking_threshold: 0
          clearing_threshold: 0
          min_obstacle_height: 0.0
          obstacle_max_range: 1.5 # 1.4m x 1.1m table
          obstacle_min_range: 0.03 # lidar range

local_costmap_client:
  ros__parameters:
    use_sim_time: False

local_costmap_rclcpp_node:
  ros__parameters:
    use_sim_time: False

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: False
      global_frame: map
      robot_base_frame: base_footprint
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      always_send_full_costmap: True
      transform_tolerance: 0.3

      footprint: "[[-0.105, -0.055], [0.105, -0.055], [0.105, 0.055], [-0.105, 0.055]]"
      resolution: 0.02

      update_frequency: 2.0
      publish_frequency: 1.0

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 1.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          marking_threshold: 0
          clearing_threshold: 0
          min_obstacle_height: 0.0
          obstacle_max_range: 1.5 # 1.4m x 1.1m table
          obstacle_min_range: 0.03 # lidar range

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.20
        cost_scaling_factor: 0.5

global_costmap_client:
  ros__parameters:
    use_sim_time: False

global_costmap_rclcpp_node:
  ros__parameters:
    use_sim_time: False

map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: "map.yaml"

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    use_sim_time: False
    planner_plugins: ["GridBased"]
    expected_planner_frequency: 1.0

    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      
      downsample_costmap: false
      downsampling_factor: 1
      
      allow_unknown: true
      max_iterations: 100000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      tolerance: 0.10
      
      motion_model_for_search: "MOORE"
      angle_quantization_bins: 1
      cost_travel_multiplier: 1.0
      use_final_approach_orientation: false
      
      smoother:
        max_iterations: 500
        w_smooth: 0.4
        w_data: 0.3
        tolerance: 1.0e-8
        do_refinement: true
        refinement_num: 2

planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: False

behavior_server:
  ros__parameters:
    use_sim_time: False
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.3

    simulate_ahead_time: 0.5

    max_rotational_vel: 0.01
    min_rotational_vel: 0.01
    rotational_acc_lim: 0.1
    spin:
      plugin: "nav2_behaviors/Spin"

    backup:
      plugin: "nav2_behaviors/BackUp"
      backup_speed: 0.02
      backup_time: 0.5
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
      speed: 0.02
      time: 0.5
    wait:
      plugin: "nav2_behaviors/Wait"

robot_state_publisher:
  ros__parameters:
    use_sim_time: False

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 5
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"   

    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200