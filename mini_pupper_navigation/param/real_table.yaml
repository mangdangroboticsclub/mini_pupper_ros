amcl:
  ros__parameters:
    use_sim_time: False
    base_frame_id: "base_footprint"
    global_frame_id: "map"
    odom_frame_id: "odom"
    scan_topic: scan
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    laser_model_type: "likelihood_field"
    set_initial_pose: True
    initial_pose: 
      x: 0.0
      y: 0.0
      yaw: 0.0
    
    # Motion model noise parameters - tuned for slow quadruped (0.03-0.06 m/s)
    # Default alpha values are ~0.2, but we reduce them for precise, slow movement
    alpha1: 0.05  # Rotation noise from translation: 0.05 << 0.2 default for precise odometry
    alpha2: 0.05  # Translation noise from translation: low for consistent slow speeds
    alpha3: 0.1   # Translation noise from rotation: slightly higher for leg placement uncertainty
    alpha4: 0.1   # Rotation noise from rotation: accounts for quadruped gait variations
    alpha5: 0.02  # Translation noise from strafe: minimal since quadruped has limited lateral drift
    
    # Beam parameters - standard for most lidars
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0

    # Particle filter - reduced for small 1.5m x 1.5m environment
    # Fewer particles needed since state space is constrained by table size
    max_particles: 500   # Reduced from typical 2000-5000 for small area
    min_particles: 200   # Maintains 2.5:1 ratio with max_particles
    max_beams: 60        # Higher than default 60 for better accuracy at slow speeds
    
    # Transform and update thresholds - smaller values for precise 21cm robot movement
    transform_tolerance: 0.1  # Consistent with RPP controller tolerance
    update_min_a: 0.1    # 0.1 rad = ~6 degrees: update AMCL after small rotations
    update_min_d: 0.05   # 5cm updates: appropriate for 21cm robot on 1.5m table
    
    # Laser model parameters - tuned for small environment and close obstacles
    laser_likelihood_max_dist: 1.0  # 1m max relevant distance (vs default 2m) for 1.5m table
    pf_err: 0.03         # Tight convergence: 3cm error tolerance for precise positioning
    pf_z: 0.95           # Balanced confidence in sensor vs motion model
    lambda_short: 0.1    # Standard unexplained short readings weight
    sigma_hit: 0.1       # 10cm sensor noise model (vs default 20cm) for precise localization
    z_hit: 0.7           # 70% weight on correct measurements
    z_max: 0.05          # 5% weight on max range readings
    z_rand: 0.2          # 20% weight on random readings
    z_short: 0.05        # 5% weight on short readings
    resample_interval: 1 # Resample every update for responsive particle filter
    save_pose_rate: 0.5  # Save pose twice per second
    tf_broadcast: true
    laser_max_range: 3.0   # 3m range limit (vs unlimited) adequate for 1.5m table environment
    laser_min_range: 0.05  # 5cm minimum for detecting close obstacles like water bottles

amcl_map_client:
  ros__parameters:
    use_sim_time: False

amcl_rclcpp_node:
  ros__parameters:
    use_sim_time: False

bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    enable_groot_monitoring: True
    groot_zmq_publisher_port: 1666
    groot_zmq_server_port: 1667
    # Standard behavior tree plugin list - enables typical navigation behaviors
    plugin_lib_names:
    - nav2_compute_path_to_pose_action_bt_node
    - nav2_compute_path_through_poses_action_bt_node
    - nav2_follow_path_action_bt_node
    - nav2_back_up_action_bt_node
    - nav2_spin_action_bt_node
    - nav2_wait_action_bt_node
    - nav2_clear_costmap_service_bt_node
    - nav2_is_stuck_condition_bt_node
    - nav2_goal_reached_condition_bt_node
    - nav2_goal_updated_condition_bt_node
    - nav2_initial_pose_received_condition_bt_node
    - nav2_reinitialize_global_localization_service_bt_node
    - nav2_rate_controller_bt_node
    - nav2_distance_controller_bt_node
    - nav2_speed_controller_bt_node
    - nav2_truncate_path_action_bt_node
    - nav2_goal_updater_node_bt_node
    - nav2_recovery_node_bt_node
    - nav2_pipeline_sequence_bt_node
    - nav2_round_robin_node_bt_node
    - nav2_transform_available_condition_bt_node
    - nav2_time_expired_condition_bt_node
    - nav2_distance_traveled_condition_bt_node
    - nav2_single_trigger_bt_node
    - nav2_is_battery_low_condition_bt_node
    - nav2_navigate_through_poses_action_bt_node
    - nav2_navigate_to_pose_action_bt_node
