amcl:
  ros__parameters:
    use_sim_time: False
    base_frame_id: "base_footprint"
    global_frame_id: "map"
    odom_frame_id: "odom"
    scan_topic: scan
    robot_model_type: "nav2_amcl::OmniMotionModel"
    laser_model_type: "likelihood_field"
    set_initial_pose: True
    initial_pose: 
      x: 0.0
      y: 0.0
      yaw: 0.0
    
    # Much higher noise for walking gait
    alpha1: 0.20  # Rotation is noisy due to leg coordination
    alpha2: 0.15  # Walking forward causes some rotation drift
    alpha3: 0.25  # High translation noise from gait oscillation
    alpha4: 0.30  # Rotating causes backward motion - VERY high
    alpha5: 0.20  # Strafing with legs is inherently noisy
    
    transform_tolerance: 0.3
    
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false

   # Increase particles to handle higher uncertainty
    max_particles: 3000  # Was 2000
    min_particles: 1000  # Was 500
    
    # Update more frequently due to drift
    update_min_a: 0.10  # Was 0.15 - update every 0.1 rad
    update_min_d: 0.04  # Was 0.08 - update every 4cm
    
    # Enable recovery for when gait causes localization loss
    recovery_alpha_fast: 0.1   # Was 0.0 - fast recovery
    recovery_alpha_slow: 0.001  # Was 0.0 - slow recovery
    
    # Increase laser measurement noise tolerance
    sigma_hit: 0.08  # Was 0.05 - account for body oscillation
    
    # Adjust beam model weights for noisier sensor readings
    z_hit: 0.75   # Was 0.85 - expect fewer perfect hits
    z_rand: 0.10  # Was 0.05 - more random readings from vibration
    z_max: 0.10   # Was 0.05 - more max readings from body tilt
    z_short: 0.05 # Was 0.05 - keep short readings low

    laser_likelihood_max_dist: 1.5 # 1.4m by 1.1m table
    pf_err: 0.05
    pf_z: 0.90
    lambda_short: 0.1

    resample_interval: 2
    save_pose_rate: 0.5
    tf_broadcast: true
    laser_max_range: 1.5 # 1.4m x 1.1m table
    laser_min_range: 0.03 # lidar range

amcl_map_client:
  ros__parameters:
    use_sim_time: False

amcl_rclcpp_node:
  ros__parameters:
    use_sim_time: False

bt_navigator:
