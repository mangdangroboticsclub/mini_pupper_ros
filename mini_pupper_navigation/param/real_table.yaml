bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: False

controller_server:
  ros__parameters:
    use_sim_time: False
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    # Velocity thresholds - must be below robot's minimum capabilities (0.03 m/s, 0.25 rad/s)
    # These detect when robot has "stopped" vs actually moving
    min_x_velocity_threshold: 0.02   # Below robot's minimum linear speed boundary
    min_y_velocity_threshold: 0.001  # Near-zero for differential-like movement patterns
    min_theta_velocity_threshold: 0.25  # Exactly robot's minimum angular speed boundary
    failure_tolerance: 0.2           # 20cm tolerance before declaring controller failure

    # 10Hz controller frequency: adequate for slow speeds (0.03-0.06 m/s)
    # At 0.06 m/s, robot moves 6mm between control cycles - sufficient precision
    controller_frequency: 10.0

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # 10cm movement required to show "progress" - appropriate for 21cm robot
      required_movement_radius: 0.1
      # 15 seconds allowance: at 0.03 m/s, robot moves 45cm in 15s
      movement_time_allowance: 15.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      # 5cm XY tolerance: precise for 21cm robot on 1.5m table
      xy_goal_tolerance: 0.05
      # 0.15 rad = ~8.6 degrees: reasonable angular precision
      yaw_goal_tolerance: 0.15
      
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      
      # Velocity parameters - strictly within robot's 0.03-0.06 m/s range
      desired_linear_vel: 0.045      # Middle of speed range for balanced performance
      max_linear_accel: 0.05         # Conservative: 0.05 m/s² = 0.03→0.06 m/s in 0.6 seconds
      max_linear_decel: 0.08         # Slightly faster decel for safety stops
      
      # Angular velocity - within robot's 0.25-0.50 rad/s range
      max_angular_accel: 0.4         # Conservative angular acceleration
      rotate_to_heading_angular_vel: 0.35  # Middle of angular range for heading corrections
      
      # Lookahead distances - optimized for 21cm robot on 1.5m table
      lookahead_dist: 0.15           # 15cm default: ~0.7x robot length for responsive turning
      min_lookahead_dist: 0.08       # 8cm minimum: prevents oversteering in tight spots
      max_lookahead_dist: 0.25       # 25cm maximum: ~1/6 of table width for longer smooth paths
      lookahead_time: 2.0            # 2 seconds: at 0.045 m/s = 9cm dynamic lookahead
      
      # Velocity-scaled lookahead: lookahead grows/shrinks with speed for stability
      use_velocity_scaled_lookahead_dist: true
      
      # Goal approach behavior - ensures smooth arrival
      min_approach_linear_velocity: 0.03  # Never command below robot's minimum speed
      # Start slowing 30cm from goal: gives plenty of deceleration space on 1.5m table
      approach_velocity_scaling_dist: 0.3
      use_interpolation: false        # Simpler control for small, slow robot
      
      # Collision detection - conservative safety for close obstacles
      use_collision_detection: true
      # 2 seconds at 0.045 m/s = 9cm lookahead: appropriate for 21cm robot avoiding water bottles
      max_allowed_time_to_collision_up_to_carrot: 2.0
      
      # Path regulation - prevents dangerous speeds in tight spaces
      use_regulated_linear_velocity_scaling: true     # Slow down for tight turns
      use_cost_regulated_linear_velocity_scaling: true # Slow down near obstacles in costmap
      regulated_linear_scaling_min_radius: 0.2        # 20cm curve radius triggers speed reduction
      regulated_linear_scaling_min_speed: 0.03        # Never regulate below robot's minimum
      
      # Transform and rotation behavior
      transform_tolerance: 0.1        # Consistent with AMCL tolerance
      use_rotate_to_heading: true     # Rotate in place for precise positioning
      rotate_to_heading_min_angle: 0.3  # 0.3 rad = ~17 degrees: rotate for significant heading changes
      
controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: False

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: False
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      plugins: ["obstacle_layer", "inflation_layer"]
      always_send_full_costmap: True

      # Robot footprint: 210mm x 110mm quadruped (21cm length, 11cm width)
      footprint: "[[-0.105, -0.055], [0.105, -0.055], [0.105, 0.055], [-0.105, 0.055]]"
      
      # Local costmap: 1m x 1m rolling window
      # Small window appropriate for 1.5m table + reduces computational load
      width: 1.0
      height: 1.0
      resolution: 0.02               # 2cm resolution: fine detail for water bottles/small boxes
      
      # Update frequencies - lower rates for slow robot (saves CPU)
      update_frequency: 5.0          # 5Hz updates adequate for 0.03-0.06 m/s speeds
      publish_frequency: 2.0         # 2Hz publishing sufficient for visualization

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # 15cm inflation: ~1.4x robot length (21cm) for safe clearance around obstacles
        inflation_radius: 0.15
        # High cost gradient: rapid cost increase near obstacles for clear avoidance
        cost_scaling_factor: 8.0

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          # 50cm max height: covers water bottles (~25cm) and small boxes (~40cm)
          max_obstacle_height: 0.5
          clearing: True
          marking: True
          data_type: "LaserScan"
          marking_threshold: 0.0     # Mark any detected obstacle
          clearing_threshold: 0.0    # Clear any non-detected space
          # 2cm min height: detect even low obstacles like bottle caps
          min_obstacle_height: 0.02

local_costmap_client:
  ros__parameters:
    use_sim_time: False

local_costmap_rclcpp_node:
  ros__parameters:
    use_sim_time: False

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: False
      global_frame: map
      robot_base_frame: base_link
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      always_send_full_costmap: True

      # Same robot footprint as local costmap
      footprint: "[[-0.105, -0.055], [0.105, -0.055], [0.105, 0.055], [-0.105, 0.055]]"
      # Match local costmap resolution for consistency
      resolution: 0.02

      # Update rates - balanced for laptop processing capability
      update_frequency: 4.0          # Increased from 2Hz: laptop can handle higher rate for dynamic obstacle updates
      publish_frequency: 2.0         # Adequate publishing rate for global costmap

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 0.5
          clearing: True
          marking: True
          data_type: "LaserScan"
          marking_threshold: 0.0
          clearing_threshold: 0.0
          min_obstacle_height: 0.02

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True  # Use reliable QoS for map data

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.15       # Match local costmap inflation
        cost_scaling_factor: 8.0     # Match local costmap cost scaling

global_costmap_client:
  ros__parameters:
    use_sim_time: False

global_costmap_rclcpp_node:
  ros__parameters:
    use_sim_time: False

map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: "map.yaml"

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25      # 25% threshold for free space
    occupied_thresh_default: 0.65  # 65% threshold for occupied space
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    use_sim_time: False
    planner_plugins: ["GridBased"]

    # 5Hz planning frequency: adequate for slow robot on small table
    # At 0.06 m/s max speed, robot moves 1.2cm between planning cycles
    expected_planner_frequency: 5.0

    GridBased:
      plugin: "nav2_smac_planner::SmacPlanner2D"
      
      # No costmap downsampling - 1.5m x 1.5m table at 2cm resolution = 75x75 grid
      # Small enough that downsampling isn't needed for performance
      downsample_costmap: false
      downsampling_factor: 1
      
      # Search parameters optimized for small environment
      allow_unknown: true             # Allow planning through unmapped areas
      max_iterations: 100000          # Reduced from default 1M for small 75x75 grid
      max_on_approach_iterations: 1000 # Standard approach refinement limit
      max_planning_time: 2.0          # 2 second timeout: generous for small space planning
      tolerance: 0.05                 # 5cm goal tolerance: precise for 21cm robot
      
      # 2D A* specific parameters
      motion_model_for_search: "MOORE"  # 8-connected search: allows diagonal movement
      angle_quantization_bins: 1        # Not used for 2D planning (SE2 only)
      cost_travel_multiplier: 1.5       # Moderate cost sensitivity: balance path length vs safety
      use_final_approach_orientation: false  # Let RPP handle final orientation
      
      # Path smoothing - important for RPP controller performance
      smoother:
        max_iterations: 500           # Reduced iterations for small paths
        w_smooth: 0.4                 # 40% weight on smoothness (vs path fidelity)
        w_data: 0.3                   # 30% weight on original path data
        tolerance: 1.0e-8             # Tight convergence tolerance
        do_refinement: true           # Enable iterative refinement
        refinement_num: 2             # Two refinement passes for smooth paths

planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: False

behavior_server:
  ros__parameters:
    use_sim_time: False
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    # 5Hz behavior frequency: adequate for slow robot recovery behaviors
    cycle_frequency: 5.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    global_frame: odom
    robot_base_frame: base_link
    # 3 second simulation horizon: at 0.06 m/s = 18cm lookahead for safety
    simulate_ahead_time: 3.0

    transform_tolerance: 0.1
    
    # Recovery rotation speeds - exactly match robot's angular capabilities
    max_rotational_vel: 0.50        # Robot's maximum angular speed limit
    min_rotational_vel: 0.25        # Robot's minimum angular speed limit
    rotational_acc_lim: 0.4         # Conservative angular acceleration for stability

    spin:
      plugin: "nav2_behaviors/Spin"   # Rotate in place recovery behavior
    backup:
      plugin: "nav2_behaviors/BackUp"
      backup_speed: 0.03             # Exactly robot's minimum linear speed
      backup_time: 2.0               # 2 seconds at 0.03 m/s = 6cm backup distance
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
      speed: 0.045                   # Middle of robot's speed range for forward recovery
      time: 1.0                      # 1 second at 0.045 m/s = 4.5cm forward movement
    wait:
      plugin: "nav2_behaviors/Wait"   # Pause behavior for clearing temporary obstacles

robot_state_publisher:
  ros__parameters:
    use_sim_time: False

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    # 5Hz waypoint processing: matches slow robot movement between waypoints
    loop_rate: 5
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"   

    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200   # 200ms pause at each waypoint