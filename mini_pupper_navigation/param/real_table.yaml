controller_server:
  ros__parameters:
    use_sim_time: False
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    # Velocity thresholds - detect when robot has "stopped"
    # Set to 50% of absolute minimums for reliable detection
    min_x_velocity_threshold: 0.005   # Half of 0.01 m/s absolute minimum
    min_y_velocity_threshold: 0.001   # Near-zero (no lateral motion)
    min_theta_velocity_threshold: 0.05 # Half of 0.10 rad/s absolute minimum
    
    # Controller failure tolerance and transform timeout
    failure_tolerance: 0.3
    # Match AMCL - reduce after testing TF delays
    transform_tolerance: 0.3

    # Controller frequency - balance between responsiveness and network load
    # At 5Hz with 0.06 m/s = 1.2cm movement between updates
    # Monitor with 'ros2 topic hz /cmd_vel' - should maintain steady 5Hz
    controller_frequency: 5.0

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.08  # 8cm movement required to show progress
      movement_time_allowance: 20.0   # Allow 20s for slow maneuvers over WiFi

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.07    # 7cm position tolerance (gait oscillation)
      yaw_goal_tolerance: 0.20    # ~11 degrees (gait-induced heading variation)
      
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      
      # ==========================================
      # AGGRESSIVE VELOCITY CONFIGURATION
      # Always targeting TOP of desired ranges
      # Desired: 0.03-0.06 m/s linear, 0.25-0.50 rad/s angular
      # Absolute safe: 0.01-0.29 m/s linear, 0.10-0.50 rad/s angular
      # ==========================================
      
      # ALWAYS cruise at maximum desired speed
      desired_linear_vel: 0.06  # TOP of desired range (aggressive)
      
      # Acceleration limits - 90% of measured hardware capabilities
      # Measured: +0.20 m/s², -0.22 m/s² (from odometry during step response)
      max_linear_accel: 0.18   # 90% of +0.20 m/s² measured max
      max_linear_decel: 0.20   # 90% of -0.22 m/s² measured max
      
      # Angular velocity - ALWAYS at TOP of desired range
      max_angular_accel: 0.4   # Tune based on actual robot testing
      rotate_to_heading_angular_vel: 0.50  # TOP of desired range (aggressive)
      
      # ==========================================
      # CRITICAL: LIDAR AT REAR CONFIGURATION
      # Lidar is at BACK of 210mm robot, not center
      # Must look ahead MORE to compensate for sensor position
      # ==========================================
      
      # Lookahead distances - INCREASED for rear lidar
      # Base lookahead should be > robot length when sensor at rear
      lookahead_dist: 0.25          # >robot length due to rear lidar
      min_lookahead_dist: 0.18      # CRITICAL: minimum 85% of robot length
      max_lookahead_dist: 0.35      # Extended for rear sensor compensation
      lookahead_time: 3.0           # Longer time for rear sensor prediction
      use_velocity_scaled_lookahead_dist: true
      
      # Approach velocities - maintain desired minimums
      min_approach_linear_velocity: 0.03  # Bottom of desired (not absolute min)
      approach_velocity_scaling_dist: 0.40  # Start slowing earlier with rear lidar
      
      # Speed regulation - less conservative for aggressive operation
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.30  # Only regulate in very tight turns
      regulated_linear_scaling_min_speed: 0.03   # Never below desired minimum
      
      # Path following
      use_interpolation: false  # Simple control for small robot
      
      # Collision detection - extended for rear lidar
      use_collision_detection: true
      # Longer projection time needed when sensor is at rear
      max_allowed_time_to_collision_up_to_carrot: 3.5
      
      # Transform tolerance - reduce after testing
      transform_tolerance: 0.3
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.35  # ~20 degrees
      
controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: False

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: False
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      plugins: ["obstacle_layer", "inflation_layer"]
      always_send_full_costmap: True
      # Match controller - reduce after testing TF delays
      transform_tolerance: 0.3

      # Robot footprint - actual dimensions
      footprint: "[[-0.105, -0.055], [0.105, -0.055], [0.105, 0.055], [-0.105, 0.055]]"
      footprint_padding: 0.01  # Small padding for position uncertainty
      
      # Local costmap window
      width: 1.0
      height: 1.0
      resolution: 0.02  # 2cm grid cells
      
      # Update rates - balanced for WiFi bandwidth
      # Monitor with 'ros2 topic bw /local_costmap/costmap'
      # Should be <1MB/s for stable WiFi operation
      update_frequency: 3.0   # 3Hz update cycle
      publish_frequency: 1.0  # 1Hz publish to reduce bandwidth

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Less conservative for aggressive navigation
        inflation_radius: 0.12  # Reduced for tighter spaces
        cost_scaling_factor: 5.0  # Less conservative gradient

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 0.5  # Table objects height
          clearing: True
          marking: True
          data_type: "LaserScan"
          marking_threshold: 0
          clearing_threshold: 0
          min_obstacle_height: 0.02  # 2cm minimum
          # Reduced ranges for reliability with oscillating lidar
          obstacle_max_range: 2.5
          obstacle_min_range: 0.08  # Filter out gait-induced ground hits

local_costmap_client:
  ros__parameters:
    use_sim_time: False

local_costmap_rclcpp_node:
  ros__parameters:
    use_sim_time: False

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: False
      global_frame: map
      robot_base_frame: base_footprint
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      always_send_full_costmap: True
      # Match other components - reduce after testing
      transform_tolerance: 0.3

      footprint: "[[-0.105, -0.055], [0.105, -0.055], [0.105, 0.055], [-0.105, 0.055]]"
      footprint_padding: 0.01
      resolution: 0.02

      # Lower update rate than local for WiFi efficiency
      update_frequency: 2.0
      publish_frequency: 1.0

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 0.5
          clearing: True
          marking: True
          data_type: "LaserScan"
          marking_threshold: 0
          clearing_threshold: 0
          min_obstacle_height: 0.02
          obstacle_max_range: 2.5
          obstacle_min_range: 0.08

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.12  # Match local costmap
        cost_scaling_factor: 5.0  # Match local costmap

global_costmap_client:
  ros__parameters:
    use_sim_time: False

global_costmap_rclcpp_node:
  ros__parameters:
    use_sim_time: False

map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: "map.yaml"

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    use_sim_time: False
    planner_plugins: ["GridBased"]
    expected_planner_frequency: 5.0

    GridBased:
      plugin: "nav2_smac_planner::SmacPlanner2D"
      
      downsample_costmap: false  # 75x75 grid is small enough
      downsampling_factor: 1
      
      allow_unknown: true
      max_iterations: 100000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      tolerance: 0.07  # Match goal checker
      
      motion_model_for_search: "MOORE"  # 8-connected grid
      angle_quantization_bins: 1  # Not used in 2D
      cost_travel_multiplier: 1.0  # Less conservative for aggressive nav
      use_final_approach_orientation: false
      
      # Smoother configuration
      smoother:
        max_iterations: 500
        w_smooth: 0.4
        w_data: 0.3
        tolerance: 1.0e-8
        do_refinement: true
        refinement_num: 2

planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: False

behavior_server:
  ros__parameters:
    use_sim_time: False
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 5.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    global_frame: odom
    robot_base_frame: base_footprint
    # Longer simulation due to rear lidar position
    simulate_ahead_time: 4.0
    # Match other components - reduce after testing
    transform_tolerance: 0.3
    
    # AGGRESSIVE RECOVERY VELOCITIES - TOP of desired ranges
    max_rotational_vel: 0.50   # TOP of desired range (also absolute max)
    min_rotational_vel: 0.25   # Bottom of desired range
    rotational_acc_lim: 0.3    # Conservative acceleration

    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
      backup_speed: 0.03        # Bottom of desired (safety)
      backup_time: 2.0          # 6cm backup distance
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
      speed: 0.06              # TOP of desired range (aggressive)
      time: 1.0                # 6cm forward probe
    wait:
      plugin: "nav2_behaviors/Wait"

robot_state_publisher:
  ros__parameters:
    use_sim_time: False

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 5
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"   

    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0  # 20Hz smoothing rate
    scale_velocities: False  # Don't scale, use actual commanded velocities
    feedback: "OPEN_LOOP"  # Don't use odometry feedback for smoothing
    # Maximum velocities [linear_x, linear_y, angular_z]
    # Using operational maximums, not absolute hardware limits
    max_velocity: [0.06, 0.0, 0.50]    # [max desired linear, 0 (no lateral), max desired angular]
    min_velocity: [-0.06, 0.0, -0.50]  # Negative for reverse motion capability
    # Acceleration limits - 90% of measured hardware capabilities
    # Measured: +0.20 m/s², -0.22 m/s² linear via odometry step response
    max_accel: [0.18, 0.0, 0.4]        # 90% of measured +0.20 m/s²
    max_decel: [-0.20, 0.0, -0.4]      # 90% of measured -0.22 m/s²
    odom_topic: "odom"
    odom_duration: 0.1  # Time window for velocity estimation from odometry
    deadband_velocity: [0.0, 0.0, 0.0]  # No deadband needed
    velocity_timeout: 1.0  # Stop if no command for 1 second