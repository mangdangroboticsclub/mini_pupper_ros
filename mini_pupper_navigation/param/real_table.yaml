amcl:
  ros__parameters:
    use_sim_time: False
    base_frame_id: "base_link"
    global_frame_id: "map"
    odom_frame_id: "odom"
    scan_topic: scan
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    laser_model_type: "likelihood_field"
    set_initial_pose: True
    initial_pose: 
      x: 0.0
      y: 0.0
      yaw: 0.0
    
    alpha1: 0.10
    alpha2: 0.10
    alpha3: 0.15
    alpha4: 0.10
    alpha5: 0.00
    
    transform_tolerance: 0.5
    
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false

    max_particles: 2000
    min_particles: 500
    
    update_min_a: 0.05
    update_min_d: 0.02
    
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.000
    
    sigma_hit: 0.08
    z_hit: 0.75
    z_rand: 0.10
    z_max: 0.10
    z_short: 0.05

    laser_likelihood_max_dist: 3.0
    pf_err: 0.05
    pf_z: 0.90
    lambda_short: 0.1

    resample_interval: 1
    save_pose_rate: 0.5
    tf_broadcast: true
    laser_max_range: 3.0
    laser_min_range: 0.03

amcl_map_client:
  ros__parameters:
    use_sim_time: False

amcl_rclcpp_node:
  ros__parameters:
    use_sim_time: False

bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 100
    default_server_timeout: 30
    filter_duration: 3.0
    transform_tolerance: 0.3
    enable_groot_monitoring: True
    groot_zmq_publisher_port: 1666
    groot_zmq_server_port: 1667

bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: False

controller_server:
  ros__parameters:
    use_sim_time: False
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.02
    
    failure_tolerance: 0.0
    transform_tolerance: 0.3
    controller_frequency: 20.0

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.025
      movement_time_allowance: 10.0

    general_goal_checker:
      stateful: False
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 6.28
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      min_vel_x: 0.05
      min_vel_y: 0.05
      max_vel_x: 0.20
      max_vel_y: 0.20
      max_vel_theta: 0.50
      min_speed_xy: 0.05
      max_speed_xy: 0.20
      min_speed_theta: 0.25
      acc_lim_x: 0.3
      acc_lim_y: 0.3
      acc_lim_theta: 2.5
      decel_lim_x: -0.3
      decel_lim_y: -0.3
      decel_lim_theta: -2.5
      vx_samples: 7
      vy_samples: 7
      vtheta_samples: 20
      sim_time: 1.0
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.3
      xy_goal_tolerance: 0.10
      trans_stopped_velocity: 0.005
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      PathAlign.scale: 256.0
      PathAlign.forward_point_distance: 0.15
      GoalAlign.scale: 0.0
      GoalAlign.forward_point_distance: 0.15
      PathDist.scale: 64.0
      GoalDist.scale: 0.0
      RotateToGoal.scale: 0.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
      
controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: False

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: False
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      plugins: ["obstacle_layer", "inflation_layer"]
      always_send_full_costmap: True
      transform_tolerance: 0.3

      footprint: "[[-0.105, -0.055], [0.105, -0.055], [0.105, 0.055], [-0.105, 0.055]]"
      
      width: 2
      height: 2
      resolution: 0.02
      
      update_frequency: 10.0
      publish_frequency: 5.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: {type: double, value: 0.10}
        cost_scaling_factor: {type: double, value: 3.0}

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 1.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          marking_threshold: 0
          clearing_threshold: 0
          min_obstacle_height: 0.0
          obstacle_max_range: 2.0
          obstacle_min_range: 0.03
          footprint_clearing_enabled: true 

local_costmap_client:
  ros__parameters:
    use_sim_time: False

local_costmap_rclcpp_node:
  ros__parameters:
    use_sim_time: False

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: False
      global_frame: map
      robot_base_frame: base_link
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      always_send_full_costmap: True
      transform_tolerance: 0.5

      footprint: "[[-0.105, -0.055], [0.105, -0.055], [0.105, 0.055], [-0.105, 0.055]]"
      resolution: 0.02

      update_frequency: 5.0
      publish_frequency: 2.0

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 1.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          marking_threshold: 0
          clearing_threshold: 0
          min_obstacle_height: 0.0
          obstacle_max_range: 2.0
          obstacle_min_range: 0.03
          raytrace_range: 2.0
          footprint_clearing_enabled: true
          clearing: True
          marking: True
          
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: {type: double, value: 0.20}
        cost_scaling_factor: {type: double, value: 2.0}

global_costmap_client:
  ros__parameters:
    use_sim_time: False

global_costmap_rclcpp_node:
  ros__parameters:
    use_sim_time: False

map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: "map.yaml"

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    use_sim_time: False
    planner_plugins: ["GridBased"]
    expected_planner_frequency: 1.0

    GridBased:
      plugin: "nav2_smac_planner::SmacPlanner2D"
      
      downsample_costmap: false
      downsampling_factor: 1
      
      allow_unknown: true
      max_iterations: 100000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      tolerance: 0.10
      
      motion_model_for_search: "MOORE"
      angle_quantization_bins: 1
      cost_travel_multiplier: 1.5
      use_final_approach_orientation: false
      
      smoother:
        max_iterations: 500
        w_smooth: 0.4
        w_data: 0.3
        tolerance: 1.0e-8
        do_refinement: true
        refinement_num: 2

planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: False

behavior_server:
  ros__parameters:
    use_sim_time: False
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.5

    simulate_ahead_time: 0.5

    max_rotational_vel: 0.01
    min_rotational_vel: 0.01
    rotational_acc_lim: 0.1
    spin:
      plugin: "nav2_behaviors::Spin"

    backup:
      plugin: "nav2_behaviors::BackUp"
      backup_speed: 0.02
      backup_time: 0.5
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
      speed: 0.02
      time: 0.5
    wait:
      plugin: "nav2_behaviors::Wait"

robot_state_publisher:
  ros__parameters:
    use_sim_time: False

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 5
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"   

    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

collision_monitor:
  ros__parameters:
    use_sim_time: False
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    transform_tolerance: 0.5
    source_timeout: 5.0
    stop_pub_timeout: 2.0
    polygons: ["PolygonStop"]
    PolygonStop:
      type: "polygon"
      points: "[[0.08, 0.06], [0.08, -0.06], [-0.08, -0.06], [-0.08, 0.06]]"
      action_type: "stop"
      min_points: 4
      visualize: true
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "scan"

docking_server:
  ros__parameters:
    use_sim_time: False
    dock_plugins: ['dummy_dock']
    dummy_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      use_battery_status: false 