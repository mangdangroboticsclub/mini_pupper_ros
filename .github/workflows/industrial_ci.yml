name: industrial_ci

on:
  push:
    paths-ignore:
    - '**.md'
  pull_request:
    paths-ignore:
    - '**.md'
  workflow_dispatch:

permissions:
  contents: read

env:
  UPSTREAM_WORKSPACE: .minipupper.repos
  # Skip keys that may not be available in Jazzy yet
  ROSDEP_SKIP_KEYS: ecl_threads ros_gz_sim ros_gz_bridge ros_gz_image gz_ros2_control

jobs:
  industrial_ci:
    strategy:
      matrix:
        env:
          # ROS 2 Jazzy on Ubuntu 24.04 (Noble)
          # Using ros-testing for latest packages
          - { ROS_DISTRO: jazzy, ROS_REPO: testing, OS_CODE_NAME: noble }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: "ros-industrial/industrial_ci@master"
        env: ${{ matrix.env }}
