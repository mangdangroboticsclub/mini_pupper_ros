name: industrial_ci
on: [push, pull_request]
jobs:
  industrial_ci:
    strategy:
      matrix:
        ros_distro: [jazzy]
        ros_repo: [main]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: 'ros-industrial/industrial_ci@master'
        env:
          ROS_DISTRO: ${{ matrix.ros_distro }}
          ROS_REPO: ${{ matrix.ros_repo }}
          OS_CODE_NAME: noble
          UPSTREAM_WORKSPACE: '.minipupper.repos'
          ROSDEP_SKIP_KEYS: "ecl_threads ros_gz_sim ros_gz_bridge ros_gz_image gz_ros2_control velodyne_gazebo_plugins gazebo_ros2_control gazebo_plugins gazebo_ros gazebo_dev gazebo_msgs gazebo_ros_pkgs champ_gazebo champ_base champ champ_msgs champ_description champ_init"
          COLCON_PKG_BLOCKLIST: "champ_gazebo"
          BEFORE_INSTALL_TARGET_DEPENDENCIES: "sudo apt-get update && sudo apt-get install -y wget && sudo wget https://packages.osrfoundation.org/gazebo.gpg -O /usr/share/keyrings/pkgs-osrf-archive-keyring.gpg && echo 'deb [arch=amd64 signed-by=/usr/share/keyrings/pkgs-osrf-archive-keyring.gpg] http://packages.osrfoundation.org/gazebo/ubuntu-stable noble main' | sudo tee /etc/apt/sources.list.d/gazebo-stable.list && sudo apt-get update && sudo apt-get install -y libgz-sim8-dev"
          BEFORE_BUILD_UPSTREAM_WORKSPACE: "sed -i '1i #include <pthread.h>' /root/upstream_ws/src/ldlidar_stl_ros/ldlidar_driver/src/logger/log_module.cpp"
