name: industrial_ci
on: [push, pull_request]
jobs:
  industrial_ci:
    strategy:
      matrix:
        ros_distro: [jazzy]
        ros_repo: [main]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: 'ros-industrial/industrial_ci@master'
        env:
          ROS_DISTRO: ${{ matrix.ros_distro }}
          ROS_REPO: ${{ matrix.ros_repo }}
          OS_CODE_NAME: noble
          # 修正点：将 gz_ros2_control 移出 skip 列表，确保 rosdep 安装其底层依赖
          ROSDEP_SKIP_KEYS: "ecl_threads ros_gz_sim ros_gz_bridge ros_gz_image velodyne_gazebo_plugins gazebo_ros2_control gazebo_plugins gazebo_ros gazebo_dev gazebo_msgs champ_gazebo"
          COLCON_PKG_BLOCKLIST: "champ_gazebo"
          # 专家级修正：在编译前手动注入 Gazebo Harmonic 的核心开发库，确保源码编译 gz_ros2_control 成功
          BEFORE_INSTALL_TARGET_DEPENDENCIES: "sudo apt-get update && sudo apt-get install -y python3-vcstool libgz-sim8-dev libgz-ros2-control-dev"
